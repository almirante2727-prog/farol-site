<style>

.beam{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.beam::before{content:"";position:absolute;top:5vh;right:5vw;width:150vmax;height:150vmax;transform-origin:100% 0;clip-path:polygon(100% 0,0 24%,0 52%);background:radial-gradient(circle at 100% 0,rgba(255,200,87,.42),rgba(255,200,87,0) 62%);animation:sway 14s ease-in-out infinite alternate}
.beam::after{content:"";position:absolute;top:calc(5vh - 6px);right:calc(5vw - 6px);width:12px;height:12px;border-radius:50%;background:var(--chip)}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.beam::before{animation:none}}
main{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;min-height:100vh;padding:24px max(24px,9vw)}

button{font:inherit;font-weight:600;padding:0 24px;border:0;border-radius:18px;background:var(--chip);color:var(--chip-fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--chip);outline-offset:2px}
.links{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;margin-top:6px}
footer{position:absolute;bottom:14px;left:max(24px,9vw);right:16px;color:var(--muted);font-size:13px}
